<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Diwali Link Maker</title>
<style>
body{font-family:system-ui,Arial,sans-serif;max-width:760px;margin:24px auto;padding:0 14px;background:#fff8ec;color:#222}
h2{margin:0 0 6px}p{margin:4px 0 12px;color:#555}
textarea{width:100%;box-sizing:border-box;min-height:140px;padding:10px;border:1px solid #cdb78a;border-radius:8px;font:inherit}
button{background:#f5a623;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #e6d3a8;border-radius:10px;padding:10px;margin-top:8px}
.row.done{opacity:.45}.row b{min-width:110px}.row small{flex:1;min-width:160px;word-break:break-all;color:#666}
.row button{margin:0;padding:7px 12px}.wa{background:#25d366;color:#fff}
</style></head><body>
<h2>🪔 Diwali Link Maker</h2>
<p>Har line mein ek naam likho. Number bhi ho to aise: <code>Rahul, 9876543210</code></p>
<textarea id="names" placeholder="Maa&#10;Papa&#10;Rahul, 9876543210&#10;Priya, 9123456780"></textarea>
<button onclick="make()">Links banao</button>
<div id="out"></div>

<script>
/* ============================================================
   ✏️  EDIT HERE — sirf yeh block badalna hai
   ============================================================ */
const SETTINGS = {
  pageLink: "https://vermillion-selkie-bc9979.netlify.app",   // 👈 tumhara Netlify link
  fromName: "Aapka Naam",                                     // 👈 yahan apna naam likho
  message: "Happy Diwali {name}! 🪔✨ Yeh aapke liye ek chhoti si wish: {link}"
};
/* ============================================================ */

function make() {
  const out = document.getElementById('out'); out.innerHTML = '';
  const lines = document.getElementById('names').value.split('\n').map(s => s.trim()).filter(Boolean);
  lines.forEach(line => {
    const [name, ph] = line.split(',').map(s => s.trim());
    const link = SETTINGS.pageLink.replace(/\/$/, '') + '/#to=' + encodeURIComponent(name) +
      (SETTINGS.fromName ? '&from=' + encodeURIComponent(SETTINGS.fromName) : '');
    const text = SETTINGS.message.replace('{name}', name).replace('{link}', link);
    let num = (ph || '').replace(/\D/g, ''); if (num.length === 10) num = '91' + num;
    const wa = 'https://wa.me/' + num + '?text=' + encodeURIComponent(text);

    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<b></b><small></small><button class="wa">WhatsApp</button><button class="cp">Copy msg</button>';
    r.querySelector('b').textContent = name;
    r.querySelector('small').textContent = link;
    r.querySelector('.wa').onclick = () => { window.open(wa, '_blank'); r.classList.add('done'); };
    r.querySelector('.cp').onclick = e => { navigator.clipboard.writeText(text); e.target.textContent = 'Copied ✓'; };
    out.appendChild(r);
  });
}
</script></body></html>
